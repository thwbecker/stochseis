[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stochseis"
version = "0.1.0"
description = "Stochastic seismicity generator on fault patch graphs (baseline for earthquake cycle models)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["stochseis*"]
